{
  "name": "Repository CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "merge_group": {
      "types": [
        "checks_requested"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "cold": {
          "description": "Rebuild dependencies without reading caches",
          "type": "boolean",
          "default": true
        }
      }
    },
    "schedule": [
      {
        "cron": "23 4 * * 1"
      }
    ]
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "jobs": {
    "repository": {
      "name": "Repository validation",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out the exact workflow revision",
          "env": {
            "CI_SOURCE_URL": "${{ github.server_url }}/${{ github.repository }}.git",
            "CI_COMMIT": "${{ github.sha }}"
          },
          "run": "git init .\ngit remote add origin \"$CI_SOURCE_URL\"\ngit -c protocol.version=2 fetch --no-tags --depth=2 origin \"$CI_COMMIT\"\ngit -c advice.detachedHead=false checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"$CI_COMMIT\"\npython3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'"
        },
        {
          "name": "Repository validation",
          "run": "python3 tools/ci/check_repository.py"
        }
      ]
    },
    "tests": {
      "name": "CI regression tests",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out the exact workflow revision",
          "env": {
            "CI_SOURCE_URL": "${{ github.server_url }}/${{ github.repository }}.git",
            "CI_COMMIT": "${{ github.sha }}"
          },
          "run": "git init .\ngit remote add origin \"$CI_SOURCE_URL\"\ngit -c protocol.version=2 fetch --no-tags --depth=2 origin \"$CI_COMMIT\"\ngit -c advice.detachedHead=false checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"$CI_COMMIT\"\npython3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'"
        },
        {
          "name": "CI regression tests",
          "run": "python3 -m unittest discover -s tools/ci/tests -v"
        },
        {
          "name": "Artifact transport regression tests",
          "run": "node --test tools/ci/tests/artifact_upload.test.mjs"
        },
        {
          "name": "Dependency infrastructure tests",
          "run": "python3 -m unittest discover -s tools/dependencies/tests -v\nnode --test tools/dependencies/tests/cache.test.mjs"
        },
        {
          "name": "Server SDK provisioning regression tests",
          "run": "python3 -m unittest discover -s tools/server/tests -v"
        },
        {
          "name": "Offline JVM metadata audit tests",
          "run": "python3 -m unittest discover -s tools/jvm/tests -v"
        },
        {
          "name": "Syncplay source-profile regression tests",
          "run": "python3 -m unittest discover -s tools/syncplay/tests -v"
        },
        {
          "name": "Native compression build-profile regression tests",
          "run": "python3 -m unittest discover -s tools/compression/tests -v"
        },
        {
          "name": "CPython startup source and isolation regressions",
          "run": "python3 tools/dependencies/build.py prepare --component cpython-startup-sources --platform linux-x64\npython3 -m unittest discover -s tools/python-runtime/tests -v"
        },
        {
          "name": "Native CPython startup SDK fixture",
          "run": "python3 tools/python-runtime/generate_policy.py --check\npython3 tools/python-runtime/native_probe.py --report artifacts/python-startup/native-sdk.json"
        }
      ]
    },
    "contracts": {
      "name": "Shared contracts",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out the exact workflow revision",
          "env": {
            "CI_SOURCE_URL": "${{ github.server_url }}/${{ github.repository }}.git",
            "CI_COMMIT": "${{ github.sha }}"
          },
          "run": "git init .\ngit remote add origin \"$CI_SOURCE_URL\"\ngit -c protocol.version=2 fetch --no-tags --depth=2 origin \"$CI_COMMIT\"\ngit -c advice.detachedHead=false checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"$CI_COMMIT\"\npython3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'"
        },
        {
          "name": "Initialize the pinned validator source",
          "run": "git submodule update --init --checkout --depth=1 -- 3rdparty/fastjsonschema"
        },
        {
          "name": "Validate contracts and acceptance fixtures offline",
          "run": "python3 tools/contracts/check_contracts.py"
        },
        {
          "name": "Contract regression tests",
          "run": "python3 -m unittest discover -s tools/contracts/tests -v"
        }
      ]
    },
    "apple": {
      "name": "Native macOS arm64",
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out the exact workflow revision",
          "env": {
            "CI_SOURCE_URL": "${{ github.server_url }}/${{ github.repository }}.git",
            "CI_COMMIT": "${{ github.sha }}"
          },
          "run": "git init .\ngit remote add origin \"$CI_SOURCE_URL\"\ngit -c protocol.version=2 fetch --no-tags --depth=2 origin \"$CI_COMMIT\"\ngit -c advice.detachedHead=false checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"$CI_COMMIT\"\npython3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'"
        },
        {
          "name": "Validate and build the native application",
          "env": {
            "CI_HEAD_COMMIT": "${{ github.event.pull_request.head.sha || github.sha }}"
          },
          "run": "python3 tools/ci/native_job.py apple"
        },
        {
          "name": "Native CPython startup SDK fixture",
          "run": "python3 tools/python-runtime/generate_policy.py --check\npython3 tools/python-runtime/native_probe.py --report artifacts/python-startup/native-sdk.json"
        },
        {
          "name": "Retain candidate and validation reports",
          "if": "${{ always() }}",
          "timeout-minutes": 5,
          "uses": "./.github/actions/upload-native",
          "with": {
            "archive": "artifacts/native/apple/artifact.zip",
            "name": "syncwatch-apple-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        }
      ]
    },
    "windows": {
      "name": "Native Windows x64",
      "runs-on": "windows-2025",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out the exact workflow revision",
          "env": {
            "CI_SOURCE_URL": "${{ github.server_url }}/${{ github.repository }}.git",
            "CI_COMMIT": "${{ github.sha }}"
          },
          "run": "git init .\ngit remote add origin \"$CI_SOURCE_URL\"\ngit -c protocol.version=2 fetch --no-tags --depth=2 origin \"$CI_COMMIT\"\ngit -c advice.detachedHead=false checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"$CI_COMMIT\"\npython -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'"
        },
        {
          "name": "Validate and build the native application",
          "env": {
            "CI_HEAD_COMMIT": "${{ github.event.pull_request.head.sha || github.sha }}"
          },
          "run": "python tools/ci/native_job.py windows"
        },
        {
          "name": "Dependency infrastructure regression tests on Windows",
          "run": "python -m unittest discover -s tools/dependencies/tests -v\npython -m unittest discover -s tools/compression/tests -v"
        },
        {
          "name": "CPython startup source and isolation regressions",
          "run": "python tools/dependencies/build.py prepare --component cpython-startup-sources --platform windows-x64\npython -m unittest discover -s tools/python-runtime/tests -v\npython -X utf8=0 -m unittest discover -s tools/ci/tests -v"
        },
        {
          "name": "Native CPython startup SDK fixture",
          "run": "python tools/python-runtime/generate_policy.py --check\npython tools/python-runtime/native_probe.py --report artifacts/python-startup/native-sdk.json"
        },
        {
          "name": "Retain candidate and validation reports",
          "if": "${{ always() }}",
          "timeout-minutes": 5,
          "uses": "./.github/actions/upload-native",
          "with": {
            "archive": "artifacts/native/windows/artifact.zip",
            "name": "syncwatch-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        }
      ]
    },
    "required": {
      "name": "ci/required",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "if": "${{ always() }}",
      "needs": [
        "repository",
        "tests",
        "contracts",
        "apple",
        "windows",
        "metadata",
        "dependency-plan",
        "dependencies"
      ],
      "steps": [
        {
          "name": "Check out the exact workflow revision",
          "env": {
            "CI_SOURCE_URL": "${{ github.server_url }}/${{ github.repository }}.git",
            "CI_COMMIT": "${{ github.sha }}"
          },
          "run": "git init .\ngit remote add origin \"$CI_SOURCE_URL\"\ngit -c protocol.version=2 fetch --no-tags --depth=2 origin \"$CI_COMMIT\"\ngit -c advice.detachedHead=false checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"$CI_COMMIT\"\npython3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'"
        },
        {
          "name": "Require all selected jobs to succeed",
          "env": {
            "CI_NEEDS_JSON": "${{ toJSON(needs) }}"
          },
          "run": "python3 tools/ci/required_status.py repository tests contracts apple windows metadata dependency-plan dependencies"
        }
      ]
    },
    "dependency-plan": {
      "name": "Dependency manifests and selection",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "outputs": {
        "matrix": "${{ steps.plan.outputs.matrix }}"
      },
      "steps": [
        {
          "name": "Check out the exact workflow revision",
          "env": {
            "CI_SOURCE_URL": "${{ github.server_url }}/${{ github.repository }}.git",
            "CI_COMMIT": "${{ github.sha }}"
          },
          "run": "git init .\ngit remote add origin \"$CI_SOURCE_URL\"\ngit -c protocol.version=2 fetch --no-tags --depth=2 origin \"$CI_COMMIT\"\ngit -c advice.detachedHead=false checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"$CI_COMMIT\"\npython3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'"
        },
        {
          "name": "Select registered dependency builds",
          "id": "plan",
          "run": "python3 tools/dependencies/build.py plan"
        }
      ]
    },
    "dependencies": {
      "name": "Dependency ${{ matrix.component }} / ${{ matrix.platform }}",
      "needs": [
        "dependency-plan"
      ],
      "strategy": {
        "fail-fast": false,
        "matrix": "${{ fromJSON(needs.dependency-plan.outputs.matrix) }}"
      },
      "uses": "./.github/workflows/dependency-build.yml",
      "with": {
        "component": "${{ matrix.component }}",
        "platform": "${{ matrix.platform }}",
        "cold": "${{ matrix.cold }}"
      },
      "if": "${{ needs.dependency-plan.result == 'success' }}"
    },
    "metadata": {
      "name": "Room metadata / ${{ matrix.target }}",
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Check out the exact workflow revision",
          "env": {
            "CI_SOURCE_URL": "${{ github.server_url }}/${{ github.repository }}.git",
            "CI_COMMIT": "${{ github.sha }}"
          },
          "run": "git init .\ngit remote add origin \"$CI_SOURCE_URL\"\ngit -c protocol.version=2 fetch --no-tags --depth=2 origin \"$CI_COMMIT\"\ngit -c advice.detachedHead=false checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"$CI_COMMIT\"\n${{ matrix.python }} -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'"
        },
        {
          "name": "Initialize the pinned validator source",
          "run": "git submodule update --init --checkout --depth=1 -- 3rdparty/fastjsonschema"
        },
        {
          "name": "Build and test the metadata server and actual wire output",
          "run": "${{ matrix.python }} tools/server/check.py --provision"
        }
      ],
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "runner": "ubuntu-24.04",
              "target": "linux-x64",
              "python": "python3"
            },
            {
              "runner": "macos-15",
              "target": "osx-arm64",
              "python": "python3"
            },
            {
              "runner": "windows-2025",
              "target": "win-x64",
              "python": "python"
            }
          ]
        }
      }
    }
  }
}
